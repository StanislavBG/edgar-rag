[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar-rag"
version = "0.1.0"
description = "SEC EDGAR RAG microservice for AI agents via x402 micropayments"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/landing.py" = ["E501"]
"src/company.py" = ["E501"]
"src/server.py" = ["E501"]
"src/audit.py" = ["E501"]
"src/highlights.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
