[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar-rag"
version = "0.1.0"
description = "SEC EDGAR RAG microservice for AI agents via x402 micropayments"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "lancedb>=0.30.0",
    "onnxruntime>=1.18.0",
    "tokenizers>=0.19.0",
    "slowapi>=0.1.9",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "sentence-transformers>=3.3.0",
    "edgartools>=3.0.0",
    "x402[evm]>=2.5.0",
    "ruff>=0.9.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/landing.py" = ["E501"]
"src/company.py" = ["E501"]
"src/server.py" = ["E501"]
"src/audit.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
