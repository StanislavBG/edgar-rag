[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar-rag"
version = "0.1.0"
description = "SEC EDGAR RAG microservice for AI agents via x402 micropayments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "lancedb==0.19.0",
    "sentence-transformers>=3.3.0",
    "slowapi>=0.1.9",
    "pydantic>=2.10.0",
    "edgartools>=3.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "pytest>=8.0.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
